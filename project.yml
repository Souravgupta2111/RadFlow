name: RadiologySuite
options:
  bundleIdPrefix: com.radstudio
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  mlx-swift:
    url: https://github.com/ml-explore/mlx-swift
    from: 0.21.0
targets:
  RadiologySuite:
    type: application
    platform: iOS
    sources: [RadiologySuite]
    entitlements:
      path: RadiologySuite/RadiologySuite.entitlements
    dependencies:
      - package: mlx-swift
        product: MLX
      - package: mlx-swift
        product: MLXNN
      - package: mlx-swift
        product: MLXFast
      - package: mlx-swift
        product: MLXFFT
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: A92V46D8LJ
      configs:
        Debug:
          CODE_SIGN_IDENTITY: Apple Development
        Release:
          CODE_SIGN_IDENTITY: Apple Distribution
    info:
      path: RadiologySuite/Info.plist
      properties:
        CFBundleDisplayName: Radflow
        CFBundleName: Radflow
        NSMicrophoneUsageDescription: Microphone is used to dictate radiology reports.
        NSSpeechRecognitionUsageDescription: Speech recognition converts your dictation into report text on-device.
        NSPhotoLibraryUsageDescription: Attach X-ray images to reports.
        NSLocalNetworkUsageDescription: LEDIS finds and connects to your desktop on the local Wi-Fi to type dictated text at the cursor.
        NSBonjourServices:
          - _ledis._tcp
        UILaunchScreen: {}
        CFBundleURLTypes:
          - CFBundleURLSchemes: [radiology]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        ITSAppUsesNonExemptEncryption: false
